name: Performance and soak

# perf : same-runner comparison of two builds (tools/perf_run.py): startup, idle, 3-vehicle demo.
# soak : the newer build running the repeated 3-vehicle demo for a long time (another runner).
# Results → perf-results / soak-results branches. Tooling only; nothing here changes the product.
# Start: workflow_dispatch, or `git push -f origin HEAD:perf-run` (soak seconds from tools/perf_soak.txt).

on:
  push:
    branches: ['perf-run']
  workflow_dispatch:
    inputs:
      base:
        description: 'release tag of the baseline AppImage'
        required: false
        default: 'v1.1.0-build.96'
      soak:
        description: 'soak seconds for the new build (0 = none; a job may run at most 6 h)'
        required: false
        default: '0'

permissions:
  contents: write
  actions: read

env:
  BASE: ${{ github.event.inputs.base || 'v1.1.0-build.96' }}

jobs:
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: AppImages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/a" && cd "${RUNNER_TEMP}/a"
          gh release download "$BASE" -R "$GITHUB_REPOSITORY" -p '*AppImage' -p 'SHA256SUMS*'
          grep AppImage SHA256SUMS* | sha256sum -c -
          mv *.AppImage base.AppImage
          git clone -q --depth 1 -b ci-appimage "https://github.com/${GITHUB_REPOSITORY}.git" cia
          cat cia/app.part.* > new.AppImage
          sed 's/MobilityLabGCS-x86_64.AppImage/new.AppImage/' cia/SHA256 | sha256sum -c -
          echo "NEW_COMMIT=$(cat cia/COMMIT)" >> "$GITHUB_ENV"
          chmod +x base.AppImage new.AppImage
      - name: Packages
        run: bash tools/perf_packages.sh
      - name: Measure (base, then new — same runner)
        run: |
          Xvfb :71 -screen 0 1920x1080x24 -nolisten tcp & sleep 2
          export DISPLAY=:71
          OUT="${RUNNER_TEMP}/perf"; mkdir -p "$OUT"
          lscpu > "$OUT/runner-cpu.txt"; free -m > "$OUT/runner-mem.txt"
          python3 tools/perf_run.py --app "${RUNNER_TEMP}/a/base.AppImage" --label base --out "$OUT"
          python3 tools/perf_run.py --app "${RUNNER_TEMP}/a/new.AppImage" --label new --out "$OUT"
          echo "base ${BASE} · new ${NEW_COMMIT} · $(date -u +%Y-%m-%dT%H:%MZ)" > "$OUT/WHAT.txt"
      - name: Publish → perf-results
        if: always()
        run: |
          cd "${RUNNER_TEMP}/perf" || exit 0
          git init -q . && git checkout -q -b perf-results
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "perf ${NEW_COMMIT}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" perf-results

  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Soak seconds
        run: |
          S="${{ github.event.inputs.soak }}"
          [ -z "$S" ] && S="$(tr -d '[:space:]' < tools/perf_soak.txt 2>/dev/null || echo 0)"
          echo "SOAK=$S" >> "$GITHUB_ENV"; echo "soak $S s"
      - name: AppImage
        if: env.SOAK != '0'
        run: |
          mkdir -p "${RUNNER_TEMP}/a" && cd "${RUNNER_TEMP}/a"
          git clone -q --depth 1 -b ci-appimage "https://github.com/${GITHUB_REPOSITORY}.git" cia
          cat cia/app.part.* > new.AppImage
          sed 's/MobilityLabGCS-x86_64.AppImage/new.AppImage/' cia/SHA256 | sha256sum -c -
          echo "NEW_COMMIT=$(cat cia/COMMIT)" >> "$GITHUB_ENV"
          chmod +x new.AppImage
      - name: Packages
        if: env.SOAK != '0'
        run: bash tools/perf_packages.sh
      - name: Soak
        if: env.SOAK != '0'
        timeout-minutes: 345
        run: |
          Xvfb :71 -screen 0 1920x1080x24 -nolisten tcp & sleep 2
          export DISPLAY=:71
          OUT="${RUNNER_TEMP}/soak"; mkdir -p "$OUT"
          lscpu > "$OUT/runner-cpu.txt"; free -m > "$OUT/runner-mem.txt"
          echo "new ${NEW_COMMIT} · soak ${SOAK} s · start $(date -u +%Y-%m-%dT%H:%MZ)" > "$OUT/WHAT.txt"
          python3 tools/perf_run.py --app "${RUNNER_TEMP}/a/new.AppImage" --label new --out "$OUT" --soak "$SOAK" --only-soak
          echo "end $(date -u +%Y-%m-%dT%H:%MZ)" >> "$OUT/WHAT.txt"
      - name: Publish → soak-results
        if: always() && env.SOAK != '0'
        run: |
          cd "${RUNNER_TEMP}/soak" || exit 0
          tail -c 3000000 new-soak.log > new-soak.tail.log 2>/dev/null && rm -f new-soak.log
          git init -q . && git checkout -q -b soak-results
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "soak ${NEW_COMMIT}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" soak-results
