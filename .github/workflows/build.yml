name: Build MobilityLab GCS

# Linux: build + start the app against a simulated tandem helicopter and save
#        screenshots/logs (fast check of every push).
# Windows: build the installer (.exe) on main, tags, or manual run.

on:
  push:
    branches: ['**', '!ci-screens']
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      windows:
        description: 'Build the Windows installer'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  QGC_REPO: mavlink/qgroundcontrol
  QGC_REF: v5.1.5
  PX4_REF: v1.15.4
  AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@8d961e61720b3c06583517fbc68d57ec0a4e9f95'

jobs:
  linux:
    name: Linux build + screen check
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write   # publish screenshots to the ci-screens branch
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout QGroundControl ${{ env.QGC_REF }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.QGC_REPO }}
          ref: ${{ env.QGC_REF }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout MobilityLab GCS
        uses: actions/checkout@v4
        with:
          path: mlgcs
          persist-credentials: false

      - name: Apply MobilityLab customisation
        run: bash mlgcs/tools/ci_prepare.sh

      - name: Setup build environment
        uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: Release
          save-cache: 'true'

      # QGC's own dependency step pulls ~1 GB of GStreamer/codec packages, which
      # is very slow on the hosted runners. Video is not needed for this check,
      # so install only what the Qt/QGC build and an X11 test run need.
      - name: Install build packages
        timeout-minutes: 25
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends \
            build-essential ninja-build ccache pkgconf patchelf file \
            libfontconfig1-dev libfreetype-dev libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-present-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libegl-dev libgl-dev libgl1-mesa-dri libglx-mesa0 \
            libusb-1.0-0-dev xvfb xauth xdotool \
            libpulse0 libpulse-mainloop-glib0 libspeechd2 libasound2t64 libunwind8 libdbus-1-3 libatspi2.0-0

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          stable: 'true'
          extra-args: -DQGC_ENABLE_WERROR=OFF -DQGC_CREATE_APPIMAGE=OFF -DQGC_BUILD_INSTALLER=OFF -DQGC_ENABLE_GST_VIDEOSTREAMING=OFF

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Screen check with simulated aircraft
        if: success()
        run: bash mlgcs/tools/ci_screens.sh "${RUNNER_TEMP}/build" "${RUNNER_TEMP}/screens"

      # ---- SITL: ArduPilot (downloaded ArduCopter SITL) and PX4 (SIH, built here) ----
      - name: Restore PX4 SITL binary
        if: success()
        id: px4bin
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/px4sitl
          key: px4-sitl-bin-${{ env.PX4_REF }}-v1

      - name: Build PX4 SITL ${{ env.PX4_REF }}
        if: success() && steps.px4bin.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 50
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'   # runner has CMake 4; PX4 v1.15 submodules declare older minimums
        run: |
          git clone -q --depth 1 --branch "$PX4_REF" --recursive --shallow-submodules -j8 https://github.com/PX4/PX4-Autopilot.git "${RUNNER_TEMP}/px4"
          # newer pip rejects ">=3.0.*" specifiers in PX4's list; strip the ".*"
          sed 's/\.\*//g' "${RUNNER_TEMP}/px4/Tools/setup/requirements.txt" > "${RUNNER_TEMP}/px4-req.txt"
          python3 -m pip install --quiet -r "${RUNNER_TEMP}/px4-req.txt" || \
            python3 -m pip install --quiet --break-system-packages -r "${RUNNER_TEMP}/px4-req.txt"
          # shallow clone has no NuttX release tags; PX4's version header script expects one
          git -C "${RUNNER_TEMP}/px4/platforms/nuttx/NuttX/nuttx" tag nuttx-0.0.0 2>/dev/null || true
          cd "${RUNNER_TEMP}/px4" && make px4_sitl_default CMAKE_ARGS="-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          # keep only what running SITL needs (binary + startup scripts), cached for later runs
          mkdir -p "${RUNNER_TEMP}/px4sitl"
          cp -a build/px4_sitl_default/bin build/px4_sitl_default/etc "${RUNNER_TEMP}/px4sitl/"
          du -sh "${RUNNER_TEMP}/px4sitl"

      - name: SITL check (목표 조정 commands)
        if: success()
        continue-on-error: true
        timeout-minutes: 25
        run: bash mlgcs/tools/ci_sitl.sh "${RUNNER_TEMP}/build" "${RUNNER_TEMP}/screens" "${RUNNER_TEMP}/px4sitl"

      - name: Publish screenshots to the ci-screens branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d "${RUNNER_TEMP}/screens" ] || exit 0
          cd "${RUNNER_TEMP}/screens"
          printf '# Screen check\n\nrun %s, commit %s\n' "${GITHUB_RUN_ID}" "${GITHUB_SHA}" > README.md
          git init -q -b ci-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screens for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screens

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-linux
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows installer
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.windows)
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout QGroundControl ${{ env.QGC_REF }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.QGC_REPO }}
          ref: ${{ env.QGC_REF }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout MobilityLab GCS
        uses: actions/checkout@v4
        with:
          path: mlgcs
          persist-credentials: false

      - name: Apply MobilityLab customisation
        run: bash mlgcs/tools/ci_prepare.sh

      - name: Setup build environment
        id: build-setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: windows
          qt-arch: win64_msvc2022_64
          aqt-source: ${{ env.AQT_SOURCE }}
          build-type: Release
          save-cache: 'true'

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          stable: 'true'
          extra-args: -DQGC_ENABLE_WERROR=OFF -DQGC_ENABLE_GST_VIDEOSTREAMING=ON

      - name: Resolve GStreamer root
        id: gst-root
        run: |
          python3 "${GITHUB_WORKSPACE}/.github/scripts/cmake_helper.py" cache-var \
            --build-dir "${RUNNER_TEMP}/build" \
            --name GStreamer_ROOT_DIR \
            --required \
            --output-key gst_root

      - name: Add GStreamer to PATH
        run: echo "${GST_ROOT}/bin" >> "$GITHUB_PATH"
        env:
          GST_ROOT: ${{ steps.gst-root.outputs.gst_root }}

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Create installer
        uses: ./.github/actions/cmake-install
        with:
          build-dir: ${{ runner.temp }}\build
          build-type: Release

      - name: Collect installer
        run: |
          mkdir -p "${RUNNER_TEMP}/dist"
          find "${RUNNER_TEMP}/build" -maxdepth 1 -iname "*installer*.exe" -exec cp {} "${RUNNER_TEMP}/dist/" \;
          ls -la "${RUNNER_TEMP}/dist"
          test -n "$(ls -A "${RUNNER_TEMP}/dist")"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MobilityLabGCS-Windows-installer
          path: ${{ runner.temp }}/dist/*.exe
          retention-days: 30
