name: UI tour (screenshots + video)

# Runs a built AppImage — the latest dev build (ci-appimage branch) or a release asset — on the
# built-in demo vehicles and records screenshots and a video of the whole console (tools/ui_tour.sh).
# Results → ui-tour-results branch. Tooling only.

on:
  push:
    branches: [ui-tour-run]       # push the commit to tour to this branch
  workflow_dispatch:
    inputs:
      release:
        description: 'release tag to take the AppImage from (empty: latest dev build)'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  tour:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: AppImage
        env:
          GH_TOKEN: ${{ github.token }}
          REL: ${{ github.event.inputs.release }}
        run: |
          mkdir -p "${RUNNER_TEMP}/rel" && cd "${RUNNER_TEMP}/rel"
          if [ -n "$REL" ]; then
            gh release download "$REL" -R "$GITHUB_REPOSITORY" -p '*AppImage' -p 'SHA256SUMS*'
            grep AppImage SHA256SUMS* | sha256sum -c -
            mv *.AppImage app.AppImage
          else
            git clone -q --depth 1 -b ci-appimage "https://github.com/${GITHUB_REPOSITORY}.git" cia
            cat cia/app.part.* > app.AppImage
            sed 's/MobilityLabGCS-x86_64.AppImage/app.AppImage/' cia/SHA256 | sha256sum -c -
            echo "dev build of $(cat cia/COMMIT)"
          fi
          chmod +x app.AppImage

      - name: Packages
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends \
            xvfb xauth xdotool imagemagick ffmpeg poppler-utils libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libpulse0 libspeechd2 libasound2t64

      - name: Tour
        timeout-minutes: 60
        run: bash tools/ui_tour.sh "${RUNNER_TEMP}/rel/app.AppImage" "${RUNNER_TEMP}/tour"

      - name: Publish → ui-tour-results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/tour" && cd "${RUNNER_TEMP}/tour"
          for v in *.mp4; do
            [ -f "$v" ] && [ "$(stat -c%s "$v")" -gt 90000000 ] && ffmpeg -loglevel error -y -i "$v" -vf scale=1600:-2 -c:v libx264 -preset veryfast -crf 34 small.mp4 && mv small.mp4 "$v"
          done
          ls -la
          git init -q -b ui-tour-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "UI tour (run ${GITHUB_RUN_ID})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ui-tour-results
