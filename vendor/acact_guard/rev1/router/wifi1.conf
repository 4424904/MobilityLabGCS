# mavlink-router — 기체 D1 를 와이파이(UDP)로 받아 QGC 와 가드로 나눔
# 실행: mavlink-routerd -c router/wifi1.conf   (또는 LINK=wifi ./demo.sh ...)
#
# 기체쪽 와이파이 모듈 설정 (예: ESP8266 MAVLink 브리지 웹페이지 http://192.168.4.1)
#   - 모드: Station (현장 공유기에 접속)  — 2대 이상이면 AP 모드로는 노트북이 동시에 붙을 수 없음
#   - GCS(Host) UDP 포트: 14551   ← 기체마다 다르게 (D1=14551, D2=14552 ...)
#   - 노트북도 같은 공유기에 접속
[General]
TcpServerPort = 0

[UdpEndpoint drone]
Mode = Server
Address = 0.0.0.0
Port = 14551

[UdpEndpoint qgc]
Mode = Normal
Address = 127.0.0.1
Port = 14550

[UdpEndpoint guard]
Mode = Normal
Address = 127.0.0.1
Port = 14541
