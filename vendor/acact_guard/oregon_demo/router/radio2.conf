# mavlink-router — 기체 D2 텔레메트리 모뎀을 QGC 와 가드로 나눔
# 실행: mavlink-routerd -c router/radio2.conf
#
# ★ Device 는 /dev/ttyUSB* 대신 고정 경로를 쓰세요. USB 꽂는 순서가 바뀌면 ttyUSB 번호가 바뀌어
#   D2 설정이 다른 기체 모뎀에 붙을 수 있습니다.  확인: ls -l /dev/serial/by-id/
#   (모뎀에 D1~D4 라벨을 붙이고 by-id 이름을 여기에 기록)
[General]
TcpServerPort = 0

[UartEndpoint radio]
Device = /dev/serial/by-id/REPLACE_WITH_D2_MODEM_ID
Baud = 57600

[UdpEndpoint qgc]
Mode = Normal
Address = 127.0.0.1
Port = 14550

[UdpEndpoint guard]
Mode = Normal
Address = 127.0.0.1
Port = 14542
